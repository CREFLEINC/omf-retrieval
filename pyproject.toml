[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "omf-retrieval"
version = "0.1.0"
description = "OMF design-document retrieval platform MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1,<1.20",
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28.1,<0.29",
    "markdown-it-py>=4.2.0,<4.3",
    "pgvector>=0.5.0,<0.6",
    "psycopg[binary]>=3.3.4,<3.4",
    "pydantic-settings>=2.15.0,<2.16",
    "sentence-transformers>=5.7.0,<5.8",
    "sqlalchemy>=2.0.52,<2.1",
    "torch==2.11.0",
    "transformers>=5.15.0,<5.16",
    "typer>=0.27.1,<0.28",
    "uvicorn>=0.52.2,<0.53",
]

[project.scripts]
omf-retrieval = "omf_retrieval.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<9.2",
    "pytest-cov>=7.1.0,<7.2",
    "ruff>=0.16.2,<0.17",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
markers = [
    "gpu: requires the prepared pinned model and a CUDA server",
]
