services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:1963bc48febf543433baa1ce3edcc6cc08154de722e22495f86681cc9a849026
    environment:
      POSTGRES_DB: omf_retrieval_test
      POSTGRES_PASSWORD: omf_retrieval_test
      POSTGRES_USER: omf_retrieval_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U omf_retrieval_test -d omf_retrieval_test
      interval: 2s
      timeout: 5s
      retries: 10
